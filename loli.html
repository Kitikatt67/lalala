<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Регистрация и вход</title>
  <link rel="stylesheet" href="../css/loli style.css">
</head>
<body>
  <main class="reg-main">
    <div class="reg-wrapper">
      <div class="reg-card">
        <h1 class="reg-title">Регистрация</h1>
        <form class="reg-form" action="#" method="post" onsubmit="return false;">
          <label for="name">Имя:</label>
          <input type="text" id="name" name="name" maxlength="50" required>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
          <label for="password">Пароль:</label>
          <input type="password" id="password" name="password" minlength="6" required>
          <label for="age">Возраст:</label>
          <select id="age" name="age" required>
            <option value="">Выберите возраст</option>
            <option value="18-25">18-25</option>
            <option value="25+">25+</option>
          </select>
          <label for="description">О себе:</label>
          <textarea id="description" name="description" maxlength="300"></textarea>
          <button type="submit" class="reg">Зарегистрироваться</button>
        </form>
      </div>
      <div class="reg-card">
        <h2 class="reg-title">Вход</h2>
        <form class="reg-form" action="#" method="post" onsubmit="return false;">
          <label for="email1">Email:</label>
          <input type="email" id="email1" name="email1" required>
          <label for="password1">Пароль:</label>
          <input type="password" id="password1" name="password1" required>
          <button type="submit" class="reg">Войти</button>
        </form>
      </div>
    </div>
    <a href="index.html" class="btn-back">Обратно на сайт</a>
  </main>
</body>
</html>
